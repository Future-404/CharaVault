name: CharaVault CI and Release

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

  release:
    name: Publish signed release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Validate tag and version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(sed -n 's/^app\.versionName=//p' gradle.properties)"
          if [[ -z "$file_version" || "$tag_version" != "$file_version" ]]; then
            echo "Tag v$tag_version does not match app.versionName=$file_version" >&2
            exit 1
          fi
          if ! [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          keystore_path="$RUNNER_TEMP/charavault-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Verify APK signature and create checksum
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk CharaVault-release.apk
          sha256sum CharaVault-release.apk | tee CharaVault-release.apk.sha256

      - name: Create update manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(cut -d ' ' -f 1 CharaVault-release.apk.sha256)"
          version="${GITHUB_REF_NAME#v}"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/CharaVault-release.apk"
          cat > update.json <<EOF
          {
            "channel": "stable",
            "versionName": "$version",
            "versionCode": $(sed -n 's/^app\.versionCode=//p' gradle.properties),
            "apkUrl": "$apk_url",
            "sha256": "$sha256",
            "minSupportedVersionCode": 1
          }
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            CharaVault-release.apk \
            CharaVault-release.apk.sha256 \
            update.json \
            --title "CharaVault $GITHUB_REF_NAME" \
            --generate-notes
